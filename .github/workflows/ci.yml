name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test on node@${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest node engines.node claims, plus current LTS. An untested
        # floor is a guess — every Dockerfile here is node 24.
        node: ["22", "lts/*"]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: "pnpm"
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Lint 🔍
        run: pnpm run lint
      - name: Format 🔍
        run: pnpm run format:check
      - name: TypeScript 🔍
        run: pnpm run typecheck
      - name: Test 🧪
        run: pnpm run test
      - name: Build 📦
        run: pnpm run build
      # This package has no CLI to smoke-test over stdio, so the equivalent
      # contract check is its export surface: `mcp-ios-core` and
      # `mcp-ios-simulator` both import these names, and neither repo's CI would
      # notice one disappearing until its own install resolved a new version.
      - name: Export surface 🔗
        run: |
          node --input-type=module -e "
            const m = await import('./dist/index.js');
            const want = ['WdaClient','flattenTree','renderScreenshot','registerInputTools',
                          'registerScreenTools','createArgs','createExec','toolNames','IosError',
                          'wdaMock','ok','fail','wrap','wrapResult','isNotAuthorized'];
            const missing = want.filter((n) => !(n in m));
            if (missing.length) {
              console.error('missing exports: ' + missing.join(', '));
              process.exit(1);
            }
            console.log('export surface ok: ' + Object.keys(m).length + ' exports');
          "
          # This package is a peer of both servers and must name neither. A tool
          # name or an env var leaking in here would be wrong in one of them.
          if grep -rEl 'ios_device_|ios_simulator_|IOS_DEVICE_|IOS_SIMULATOR_' src/; then
            echo "core must not name either server's tools or environment"; exit 1
          fi

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    # id-token: write is required for OIDC trusted publishing + provenance
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"
          registry-url: https://registry.npmjs.org
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Upgrade npm 🔧
        # OIDC trusted publishing needs a recent npm CLI
        run: npm install -g npm@latest
      # A version already on npm cannot be republished, so re-running this job
      # would fail on a duplicate. Skip instead, so pushing a tag is always safe.
      - name: Check npm for this version 🔍
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already published — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish 🚀
        if: steps.published.outputs.exists == 'false'
        run: npm publish --provenance --access public

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Create release 🏷️
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
